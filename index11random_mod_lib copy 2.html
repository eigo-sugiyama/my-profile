<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像の移動 - GSAP使用</title>
    <style>
        #container {
            width: 500px;
            height: 500px;
            border: 1px solid #000;
            position: relative;
            overflow: hidden;
        }
        #image {
            width: 100px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
    <!-- GSAPのCDNを読み込み -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.1/gsap.min.js"></script>
</head>
<body>
    <div id="container">
        <img id="image" src="img/プロフィール用画像.png" alt="Floating Image">
    </div>

    <script>
        const image = document.getElementById('image');
        const container = document.getElementById('container');
        const containerHeight = container.clientHeight;
        const imageHeight = image.clientHeight;

        // 画像の開始位置を中央に設定
        let posY = (containerHeight - imageHeight) / 2;

        // 画像を中央に配置
        image.style.top = posY + 'px';

        function floatImage() {
            // 上下に動く範囲を設定
            const floatDistance = 21; // 浮かび上がる距離
            const duration = 1.2; // アニメーションの時間

            gsap.to(image, {
                y: -floatDistance, // 上方向に移動
                duration: duration,
                ease: "power1.inOut",
                yoyo: true, // アニメーションを往復させる
                repeat: -1 // 無限に繰り返す
            });
        }

        floatImage(); // アニメーションを開始
    </script>
</body>
</html>
