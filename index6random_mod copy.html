<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像の移動</title>
    <style>
        #container {
            width: 500px;
            height: 500px;
            border: 1px solid #000;
            position: relative;
            overflow: hidden;
        }
        #image {
            width: 100px;
            position: absolute;
        }
    </style>
</head>
<body>
    <div id="container">
        <img id="image" src="img/プロフィール用画像.png" alt="Moving Image">
    </div>

    <script>
        const image = document.getElementById('image');
        const container = document.getElementById('container');
        const containerWidth = container.clientWidth;
        const containerHeight = container.clientHeight;
        const imageWidth = image.clientWidth;
        const imageHeight = image.clientHeight;

        // 画像の開始位置を中央に設定
        let posX = (containerWidth - imageWidth) / 2;
        let posY = (containerHeight - imageHeight) / 2;

        // 開始時点の移動方向をランダムに設定
        let directionX = Math.random() < 0.5 ? 1 : -1;
        let directionY = Math.random() < 0.5 ? 1 : -1;
        let speed = 2; // スピードを一定に保つための値

        function moveImage() {
            posX += directionX * speed;
            posY += directionY * speed;

            let hitWall = false;

            if (posX + imageWidth > containerWidth || posX < 0) {
                directionX *= -1;
                hitWall = true;
            }
            if (posY + imageHeight > containerHeight || posY < 0) {
                directionY *= -1;
                hitWall = true;
            }

            if (hitWall) {
                changeDirection();
            }

            image.style.left = posX + 'px';
            image.style.top = posY + 'px';

            requestAnimationFrame(moveImage);
        }

        function changeDirection() {
            // 壁に当たった場合のみランダムな方向転換を行う
            directionX = Math.random() < 0.5 ? 1 : -1;
            directionY = Math.random() < 0.5 ? 1 : -1;
        }

        // 画像を中央に配置
        image.style.left = posX + 'px';
        image.style.top = posY + 'px';

        moveImage();
    </script>
</body>
</html>
